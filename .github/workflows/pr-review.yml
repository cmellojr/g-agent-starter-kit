name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true

concurrency:
  group: jules-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve PR number and head SHA
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ inputs.pr_number }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
          fi
          HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid')
          echo "number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set pending status
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f state=pending -f context=jules/review \
            -f description='Jules is reviewing this PR…'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post in-progress comment
        id: comment
        run: |
          set +e
          # Use gh api to create the comment which returns JSON; capture full output for diagnostics
          RESPONSE=$(gh api -X POST "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments" \
            -f body="🤖 **Jules is reviewing this PR.** Results will appear here shortly (typically 1-5 minutes)." 2>&1)
          RC=$?
          set -e

          if [ $RC -ne 0 ]; then
            echo "Warning: gh api failed to create comment (exit $RC). gh output:"
            echo "$RESPONSE"
            # Provide an empty output so later steps that expect an id do not fail the job unexpectedly
            echo "id=" >> $GITHUB_OUTPUT
          else
            # Parse id safely; if parsing fails, emit diagnostics instead of letting jq exit the step
            COMMENT_ID=$(echo "$RESPONSE" | jq -r '.id' 2>/dev/null || true)
            if [ -z "$COMMENT_ID" ] || [ "$COMMENT_ID" = "null" ]; then
              echo "Warning: could not parse comment id from gh response:"
              echo "$RESPONSE"
              echo "id=" >> $GITHUB_OUTPUT
            else
              echo "id=$COMMENT_ID" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR diff
        run: |
          gh pr diff "${{ steps.pr.outputs.number }}" > pr.diff
          DIFF_SIZE=$(wc -c < pr.diff)
          echo "Diff size: $DIFF_SIZE bytes"
          if [ "$DIFF_SIZE" -gt 80000 ]; then
            echo "Truncating diff from $DIFF_SIZE to 80000 bytes"
            head -c 80000 pr.diff > pr.diff.truncated
            mv pr.diff.truncated pr.diff
            echo "Diff was truncated to 80000 bytes — review may be incomplete." > truncated_note.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build prompt
        run: |
          RULES=""
          if [ -f .github/jules-review-rules.md ]; then
            RULES=$(cat .github/jules-review-rules.md)
          fi
          DIFF=$(cat pr.diff)
          TRUNCATED_NOTE=$(cat truncated_note.txt 2>/dev/null || echo "")
          PR_TITLE="$(gh pr view "${{ steps.pr.outputs.number }}" --json title --jq '.title' 2>/dev/null || echo '')"
          PR_BODY="$(gh pr view "${{ steps.pr.outputs.number }}" --json body --jq '.body' 2>/dev/null || echo '')"
          jq -n \
            --arg prompt "$(
              echo "You are an expert code reviewer. Review the pull request below."
              echo ""
              echo "# Repository"
              echo "${{ github.repository }}"
              echo ""
              echo "# UNTRUSTED: PR title"
              echo "$PR_TITLE"
              echo ""
              echo "# UNTRUSTED: PR description"
              echo "${PR_BODY:-(no description)}"
              echo ""
              echo "# PR ## ${{ steps.pr.outputs.number }}"
              echo ""
              if [ -n "$RULES" ]; then
                echo "# UNTRUSTED: Project-specific review rules"
                echo "$RULES"
                echo ""
              fi
              if [ -n "$TRUNCATED_NOTE" ]; then
                echo "NOTE: $TRUNCATED_NOTE"
                echo ""
              fi
              echo "# UNTRUSTED: Diff"
              echo '\'\'\'diff'
              echo "$DIFF"
              echo '\'\'\'"
              echo ""
              echo "# What to review"
              echo "Focus ONLY on lines changed in this diff. Evaluate for:"
              echo ""
              echo "- **Correctness**: logic errors, null/undefined handling, race conditions, off-by-ones, broken APIs, edge cases."
              echo "- **Security**: injection risks (SQL/command/XSS), hardcoded secrets, insecure crypto, auth/authz flaws, sensitive data in logs or URLs."
              echo "- **Reliability**: missing error handling where it matters, unhandled promise rejections, resource leaks."
              echo "- **Maintainability**: duplication, unclear naming, dead code, violated project rules above."
              echo ""
              echo "# What NOT to flag"
              echo "Skip linter-catchable issues, pre-existing issues in unchanged lines, pedantic nitpicks, and hypothetical problems."
              echo ""
              echo "Tag each finding as [BLOCKING], [WARN], or [NIT]."
              echo "End with EXACTLY one line: VERDICT: approve | VERDICT: comment | VERDICT: block"
            )" \
            --arg source "sources/github/${{ github.repository }}" \
            '{
              prompt: $prompt,
              title: ("Review PR #" + env.PR_NUM),
              sourceContext: {
                source: $source,
                githubRepoContext: { startingBranch: "main" }
              }
            }' > jules_payload.json
        env:
          PR_NUM: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Invoke Jules API
        id: jules
        run: |
          RESPONSE=$(curl -s -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${{ secrets.JULES_API_KEY }}" \
            -d @jules_payload.json)
          SESSION_ID=$(echo "$RESPONSE" | jq -r '.id')
          SESSION_NAME=$(echo "$RESPONSE" | jq -r '.name')
          echo "Session created: $SESSION_NAME (id: $SESSION_ID)"
          echo "id=$SESSION_ID" >> $GITHUB_OUTPUT

      - name: Poll for review completion
        id: poll
        run: |
          SESSION_ID="${{ steps.jules.outputs.id }}"
          DEADLINE=$(( $(date +%s) + 900 ))
          REVIEW=""
          POLL_INTERVAL=20
          while [ $(date +%s) -lt $DEADLINE ]; do
            STATE=$(curl -s -H "x-goog-api-key: ${{ secrets.JULES_API_KEY }}" \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" | jq -r '.state')
            echo "Session state: $STATE"
            case "$STATE" in
              COMPLETED)
                ACTIVITIES=$(curl -s -H "x-goog-api-key: ${{ secrets.JULES_API_KEY }}" \
                  "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=50")
                REVIEW=$(echo "$ACTIVITIES" | jq -r '[.activities[] | select(.agentMessaged != null) | .agentMessaged.agentMessage] | last')
                if [ -n "$REVIEW" ] && [ "$REVIEW" != "null" ]; then
                  echo "Review obtained (${#REVIEW} chars)"
                  echo "review<<JULES_EOF" >> $GITHUB_OUTPUT
                  echo "$REVIEW" >> $GITHUB_OUTPUT
                  echo "JULES_EOF" >> $GITHUB_OUTPUT
                  VERDICT=$(echo "$REVIEW" | grep -oP 'VERDICT:\s*\K(approve|comment|block)' | tail -1)
                  echo "verdict=${VERDICT:-comment}" >> $GITHUB_OUTPUT
                  break
                fi
                echo "No agentMessaged found, waiting…"
                POLL_INTERVAL=20
                ;;
              FAILED)
                REASON=$(curl -s -H "x-goog-api-key: ${{ secrets.JULES_API_KEY }}" \
                  "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" | jq -r '.stateReason // "Unknown"')
                echo "Session failed: $REASON"
                echo "review=Session failed: $REASON" >> $GITHUB_OUTPUT
                echo "verdict=error" >> $GITHUB_OUTPUT
                break
                ;;
              AWAITING_PLAN_APPROVAL|AWAITING_USER_FEEDBACK)
                echo "Session needs input — approving plan"
                curl -s -X POST \
                  -H "x-goog-api-key: ${{ secrets.JULES_API_KEY }}" \
                  -H "Content-Type: application/json" \
                  -d '{}' \
                  "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID:approvePlan" > /dev/null
                POLL_INTERVAL=20
                ;;
            esac
            sleep $POLL_INTERVAL
          done
          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            echo "review=Jules did not return a review within the timeout." >> $GITHUB_OUTPUT
            echo "verdict=timeout" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR comment with review
        run: |
          REVIEW="${{ steps.poll.outputs.review }}"
          if [ -n "$REVIEW" ]; then
            BODY="## 🤖 Jules Review\n\n${REVIEW}"
            gh api "repos/${{ github.repository }}/issues/comments/${{ steps.comment.outputs.id }}" \
              -X PATCH \
              -f body="$BODY" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/comments/${{ steps.comment.outputs.id }}" \
              -X PATCH \
              -f body="⚠️ **Jules review failed to complete.**" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set commit status
        run: |
          VERDICT="${{ steps.poll.outputs.verdict }}"
          case "$VERDICT" in
            approve|comment)
              STATE=success
              DESC="Review complete (verdict: $VERDICT)"
              ;;
            block)
              STATE=failure
              DESC="Blocking issues found"
              ;;
            *)
              STATE=failure
              DESC="Review failed ($VERDICT)"
              ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f state=$STATE -f context=jules/review \
            -f description="$DESC"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
